ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - playground

# The tests use its Node loader, server and client, none of which needs webpack.
packageExtensions:
  react-server-dom-webpack:
    peerDependenciesMeta:
      webpack:
        optional: true

allowBuilds:
  simple-git-hooks: true

catalogs:
  cli:
    "@antfu/ni": ^30.6.0
    "@arethetypeswrong/core": ^0.18.5
    "@eslint-react/eslint-plugin": ^5.24.10
    "@kirklin/eslint-config": ^8.5.0
    "@typescript/native": npm:typescript@^7.0.2
    bumpp: ^12.3.0
    eslint: ^10.12.0
    eslint-plugin-erasable-syntax-only: ^0.7.2
    eslint-plugin-format: ^2.0.1
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.7
    lint-staged: ^17.6.0
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tsdown: ^0.23.0
    typescript: npm:@typescript/typescript6@^6.0.2
  frontend:
    react: ^19.3.0
    react-dom: ^19.3.0
  playground:
    "@fontsource-variable/geist": ^5.3.0
    "@tailwindcss/vite": ^4.3.3
    "@vitejs/plugin-react": ^6.1.2
    lucide-react: ^1.55.0
    tailwindcss: ^4.3.3
    vite: ^8.3.4
  prod:
    "@radix-ui/react-direction": ^1.1.5
    "@radix-ui/react-slot": ^1.4.0
  testing:
    "@vitest/browser-playwright": ^5.0.3
    playwright: ^1.64.0
    react-server-dom-webpack: ^19.3.0
    vitest: ^5.0.3
    vitest-browser-react: ^2.3.0
  types:
    "@types/node": ^26.6.5
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
